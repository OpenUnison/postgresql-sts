{{- if and .Values.cluster.enabled .Values.traefik.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ .Values.cluster.name }}
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - {{ .Values.traefik.entryPoint | quote }}
  routes:
    - match: 'HostSNI(`*`)'
      services:
        - name: {{ .Values.cluster.name }}-rw
          port: 5432
{{- end }}
