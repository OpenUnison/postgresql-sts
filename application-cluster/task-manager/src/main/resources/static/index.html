<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskboard</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><div class="shell"><aside><a class="brand" href="/">▣ <span>Taskboard</span></a><div class="workspace">WORKSPACE</div><div class="nav-item">▤ &nbsp; All tasks</div><p class="aside-note">A little clarity.<br>A lot of progress.</p></aside>
<main><header><div><p class="eyebrow">YOUR WORK, IN FOCUS</p><h1>Make room for progress.</h1><p class="subtitle">Capture what matters. Take it one task at a time.</p></div><button id="new-task">＋ New task</button></header>
<section class="stats" aria-label="Task summary"><div><span>Total tasks</span><strong id="total">—</strong></div><div><span>In progress</span><strong id="progress">—</strong></div><div><span>Completed</span><strong id="completed">—</strong></div></section>
<section class="panel"><div class="toolbar"><div class="filters" aria-label="Filter tasks"><button data-filter="ALL" class="selected">All tasks</button><button data-filter="TODO">To do</button><button data-filter="IN_PROGRESS">In progress</button><button data-filter="DONE">Done</button></div><label class="search">Search <input id="search" type="search" placeholder="Find a task…"></label></div>
<p id="error" class="error" role="alert" hidden></p><div id="tasks" aria-live="polite"></div></section><footer>Small steps move things forward.</footer></main></div>
<dialog id="editor"><form id="task-form"><div class="dialog-heading"><h2 id="dialog-title">New task</h2><button type="button" id="close-dialog" class="icon" aria-label="Close">×</button></div><label>Title<input id="title" required maxlength="200" placeholder="What needs to get done?"></label><label>Description<textarea id="description" maxlength="5000" rows="4" placeholder="Add a little context…"></textarea></label><div class="form-grid"><label>Status<select id="status"><option value="TODO">To do</option><option value="IN_PROGRESS">In progress</option><option value="DONE">Done</option></select></label><label>Due date<input id="due-date" type="date"></label></div><p id="form-error" class="error" role="alert" hidden></p><div class="dialog-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button id="save" type="submit">Save task</button></div></form></dialog>
</body></html>
