network:
  openunison_host: "k8sou.192-168-2-115.nip.io"
  dashboard_host: "k8sdb.192-168-2-115.nip.io"
  api_server_host: "k8sapi.192-168-2-115.nip.io"
  session_inactivity_timeout_seconds: 900
  k8s_url: https://192.168.2.130:6443
  force_redirect_to_tls: false
  createIngressCertificate: true
  ingress_type: nginx
  ingress_annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: enterprise-ca

cert_template:
  ou: "Kubernetes"
  o: "MyOrg"
  l: "My Cluster"
  st: "State of Cluster"
  c: "MyCountry"



myvd_config_path: "WEB-INF/myvd.conf"
k8s_cluster_name: openunison-cp
enable_impersonation: false

certs:
  use_k8s_cm: false

trusted_certs:
- name: ldaps
  pem_b64: 
- name: enterprise-ca
  pem_b64: 
- name: internal-ca
  pem_b64: 

monitoring:
  prometheus_service_account: system:serviceaccount:monitoring:prometheus-k8s

