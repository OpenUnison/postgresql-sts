sts:
  endpoints:
  - name: postgresql
    host_in_openunison: true
    audience: postgresql.apps.192-168-2-171.nip.io
    path: /psql
    azRules:
    - scope: filter
      constraint: "(objectClass=*)"
    issuer:
      host: vault-sts.apps.192-168-2-115.nip.io
      keypair: sts-vault
      path: /psql
    injector:
      label: psql-sts
      token_environment_variable_name: PSQL_TOKEN_FILE
      label_value_environment_variable_name: PSQL_TOKEN_ENABLED
      explicit_certificate_trust: true
    additionalAttributes:
    - target: scope
      type: static
      source: openid

operator:
  mutators:
   - injector-vault
   - injector-psql